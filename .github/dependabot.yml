version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    labels:
      - dependencies
    groups:
      # Low-risk updates land as one reviewable PR; majors stay separate for human judgement.
      safe-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Node major upgrades are a runtime decision (Prompt 014), not an automated bump.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
