<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Settings — Prompt 044</title>
    <link rel="stylesheet" href="../tokens/tokens.css" />
  </head>
  <body data-theme="light">
    <section class="settings-panel" aria-labelledby="settings-heading">
      <h2 id="settings-heading">Comparison settings</h2>
      <p>Safe defaults work untouched. Experimental mode is disabled.</p>
      <label>Result count <input type="number" name="resultCount" min="1" max="1000" value="250" /></label>
      <label>Common-match threshold <input type="number" value="10" /></label>
      <label>Report label <input type="text" maxlength="80" /></label>
      <button type="button">Reset to defaults</button>
    </section>
  </body>
</html>
