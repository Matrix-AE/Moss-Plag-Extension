<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mode selector — Prompt 038</title>
    <link rel="stylesheet" href="../tokens/tokens.css" />
    <link rel="stylesheet" href="../typography/typography.css" />
    <style>
      body { margin: 16px; font-family: var(--font-ui); background: var(--surface); color: var(--text); }
      .mode-card { display: block; border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin: 8px 0; }
      input { margin-right: 8px; }
      #status { margin-top: 12px; }
    </style>
  </head>
  <body data-theme="light">
    <h1 class="type-title">Choose a comparison mode</h1>
    <fieldset class="mode-selector" role="radiogroup" aria-labelledby="mode-heading"><legend id="mode-heading" class="type-label">Comparison mode</legend><label class="mode-card focus-ring" for="mode-pair"><input type="radio" name="comparison-mode" id="mode-pair" value="pair" checked /><span class="type-subtitle">Pair Check</span><span class="type-helper">Compare exactly two logical submissions. Each submission may contain multiple files that belong together.</span></label><label class="mode-card focus-ring" for="mode-batch"><input type="radio" name="comparison-mode" id="mode-batch" value="batch"  /><span class="type-subtitle">Batch Check</span><span class="type-helper">Compare two or more logical submissions under one language. Folders and approved archives can each become a submission group.</span></label></fieldset>
    <p id="status" class="type-helper" role="status"></p>
    <script>
      const status = document.getElementById("status");
      const copy = {
        pair: "Exactly two groups required before continue.",
        batch: "At least two groups required before continue.",
      };
      function sync() {
        const value = document.querySelector("input[name=comparison-mode]:checked").value;
        status.textContent = copy[value];
      }
      document.querySelectorAll("input[name=comparison-mode]").forEach((input) => {
        input.addEventListener("change", sync);
      });
      sync();
    </script>
  </body>
</html>
